name: Version tags

# .github/version-tags.txt 에 적힌 버전 태그 중 아직 없는 것을 만든다.
on:
  push:
    branches: [main]
    paths: [".github/version-tags.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create missing tags
        run: |
          git config user.name "Jin"
          git config user.email "116756108+dup04205@users.noreply.github.com"
          git fetch --tags -q
          grep -v '^#' .github/version-tags.txt | while read -r tag sha desc; do
            [ -z "$tag" ] && continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "있음: $tag"
            else
              git tag -a "$tag" "$sha" -m "PHOTO-LOG $tag: $desc"
              git push -q origin "refs/tags/$tag"
              echo "만듦: $tag -> $sha"
            fi
          done
