name: Version tags

# .github/version-tags.txt 에 적힌 버전 태그 중 아직 없는 것을 만든다.
on:
  push:
    branches: [main]
    paths: [".github/version-tags.txt", ".github/workflows/tags.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create missing tags
        shell: bash
        run: |
          set -u
          git config user.name "Jin"
          git config user.email "116756108+dup04205@users.noreply.github.com"
          git fetch --tags -q || true
          fail=0
          while read -r tag sha desc; do
            case "$tag" in ""|\#*) continue ;; esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "있음: $tag"
              continue
            fi
            if ! out=$(git tag -a "$tag" "$sha" -m "PHOTO-LOG $tag: $desc" 2>&1); then
              echo "::error::tag $tag 실패: $out"; fail=1; continue
            fi
            if ! out=$(git push origin "refs/tags/$tag" 2>&1); then
              echo "::error::push $tag 실패: $out"; fail=1; continue
            fi
            echo "::notice::만듦 $tag -> $sha"
          done < .github/version-tags.txt
          exit $fail
