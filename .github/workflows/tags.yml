name: Version tags

# .github/version-tags.txt 에 적힌 버전 태그 중 아직 없는 것을 만든다.
on:
  push:
    branches: [main]
    paths: [".github/version-tags.txt", ".github/workflows/tags.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create missing tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          fail=0
          existing=$(gh api "repos/$REPO/git/matching-refs/tags/" --jq '.[].ref' || true)
          while read -r tag sha desc; do
            case "$tag" in ""|\#*) continue ;; esac
            if echo "$existing" | grep -qx "refs/tags/$tag"; then
              echo "있음: $tag"; continue
            fi
            # 태그 객체(설명 포함)를 만든 뒤 refs/tags 를 연결한다
            if ! obj=$(gh api "repos/$REPO/git/tags" -f tag="$tag" -f object="$sha" -f type=commit \
                  -f message="PHOTO-LOG $tag: $desc" --jq .sha 2>&1); then
              echo "::error::tag $tag 실패: $(echo "$obj" | tr '\n' ' ')"; fail=1; continue
            fi
            if ! out=$(gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$obj" 2>&1); then
              echo "::error::ref $tag 실패: $(echo "$out" | tr '\n' ' ')"; fail=1; continue
            fi
            echo "::notice::만듦 $tag -> $sha"
          done < .github/version-tags.txt
          exit $fail
