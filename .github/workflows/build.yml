name: Build APK

on:
  push:
    branches: [main]
    # iOS 쪽만 바뀐 커밋에서는 APK를 다시 빌드하지 않는다
    paths-ignore: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 외부 Actions는 태그가 바뀌어도 영향이 없도록 커밋 해시로 고정한다 (모두 v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      # 서명 키는 저장소가 아니라 GitHub Secrets에만 둔다.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          # 폰에서 긴 값이 잘리지 않도록 두 조각으로 나눠 등록할 수도 있다(있으면 뒤에 이어 붙인다)
          SIGNING_KEYSTORE_B64_1: ${{ secrets.SIGNING_KEYSTORE_B64_1 }}
          SIGNING_KEYSTORE_B64_2: ${{ secrets.SIGNING_KEYSTORE_B64_2 }}
          SIGNING_KEYSTORE_B64_PART1: ${{ secrets.SIGNING_KEYSTORE_B64_PART1 }}
          SIGNING_KEYSTORE_B64_2_PART2: ${{ secrets.SIGNING_KEYSTORE_B64_2_PART2 }}
        run: |
          # 앞조각은 SIGNING_KEYSTORE_B64 / _1 / _PART1, 뒷조각은 _2 / _2_PART2 어느 이름이든 받는다
          # (GitHub Secret 이름은 대소문자를 구분하지 않는다)
          [ -z "$SIGNING_KEYSTORE_B64" ] && SIGNING_KEYSTORE_B64="$SIGNING_KEYSTORE_B64_1"
          [ -z "$SIGNING_KEYSTORE_B64" ] && SIGNING_KEYSTORE_B64="$SIGNING_KEYSTORE_B64_PART1"
          [ -z "$SIGNING_KEYSTORE_B64_2" ] && SIGNING_KEYSTORE_B64_2="$SIGNING_KEYSTORE_B64_2_PART2"
          len() { printf '%s' "$1" | tr -d ' \r\n\t' | wc -c; }
          echo "::notice::키 조각 길이 - 앞: $(len "$SIGNING_KEYSTORE_B64")자, 뒤(_2): $(len "$SIGNING_KEYSTORE_B64_2")자 (정상: 1778자, 1778자. 한 번에 넣었다면 앞 3556자, 뒤 0자)"
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret이 없습니다. 저장소 Settings > Secrets and variables > Actions에 등록하세요."
            exit 1
          fi
          # 붙여넣을 때 섞인 공백·줄바꿈은 base64가 아니므로 지운다
          printf '%s%s' "$SIGNING_KEYSTORE_B64" "$SIGNING_KEYSTORE_B64_2" | tr -d ' \r\n\t' | base64 -d > app/release.keystore \
            || { echo "::error::SIGNING_KEYSTORE_B64 값을 해독하지 못했습니다. 파일 내용 전체를 다시 붙여넣으세요."; exit 1; }

      - name: Check signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          PW=$(printf '%s' "$SIGNING_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          if [ -z "$PW" ]; then
            echo "::error::SIGNING_PASSWORD secret이 없습니다."; exit 1
          fi
          if ! out=$(keytool -list -v -keystore app/release.keystore -storepass "$PW" 2>&1); then
            echo "::error::서명 키를 열지 못했습니다: $(echo "$out" | grep -m1 -i 'keytool error' | cut -c1-300)"
            echo "::error::키 파일 $(wc -c < app/release.keystore)바이트, sha256 $(sha256sum app/release.keystore | cut -c1-16) / 비밀번호 ${#PW}자 (정상: 2666바이트, sha256 900c76af30301b5a, 28자)"
            exit 1
          fi
          echo "::notice::서명 키 $(echo "$out" | grep -m1 -E 'SHA256:|SHA-256' | tr -s ' ')"
          echo "::add-mask::$PW"
          echo "SIGNING_PASSWORD_CLEAN=$PW" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          if ! SIGNING_PASSWORD="$SIGNING_PASSWORD_CLEAN" ./gradlew assembleRelease --no-daemon > build.log 2>&1; then
            echo "::error::빌드 실패: $(grep -A12 'What went wrong' build.log | tr '\n' ' ' | cut -c1-1500)"
            tail -60 build.log
            exit 1
          fi
          tail -5 build.log
          cp app/build/outputs/apk/release/app-release.apk PHOTO-LOG.apk
          rm -f app/release.keystore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: photo-log-apk
          path: PHOTO-LOG.apk

      # 최신 APK를 apk 브랜치에 한 파일로 보관한다(이전 빌드는 덮어쓴다).
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp PHOTO-LOG.apk out/
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "build ${{ github.run_number }} · ${{ github.sha }}" > BUILD.txt
          git add PHOTO-LOG.apk BUILD.txt
          git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
