# XcodeGen 설정. `xcodegen generate` 로 PhotoLog.xcodeproj 를 만든다(프로젝트 파일은 저장소에 두지 않는다).
name: PhotoLog
options:
  bundleIdPrefix: com.dup04205
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19

targets:
  PhotoLog:
    type: application
    platform: iOS
    sources:
      - path: PhotoLog
    dependencies:
      - package: ZIPFoundation
    scheme: {}
    info:
      path: PhotoLog/Info.plist
      properties:
        CFBundleDisplayName: PHOTO-LOG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - playfair_display_semibold_italic.ttf
          - playfair_display_bold_italic.ttf
          - gowun_batang_regular.ttf
          - gowun_batang_bold.ttf
          - dseg7_classic_italic.ttf
        NSCameraUsageDescription: 앱 안에서 사진을 찍어 기록을 남기기 위해 카메라를 사용합니다. 찍은 사진은 이 기기의 PHOTO-LOG 안에만 저장됩니다.
        NSLocationWhenInUseUsageDescription: 카메라로 찍은 사진에 촬영 장소(예. 성수동 카페)를 함께 기록하기 위해 앱을 사용하는 동안 위치를 확인합니다. 위치는 이 기기 안에만 저장됩니다.
        NSPhotoLibraryUsageDescription: 앨범에서 가져온 사진의 촬영 날짜와 장소를 기록에 넣기 위해 사진 보관함의 촬영 정보를 읽습니다. 고른 사진만 앱으로 가져옵니다.
    settings:
      base:
        PRODUCT_NAME: PhotoLog
        PRODUCT_BUNDLE_IDENTIFIER: com.dup04205.photolog
        MARKETING_VERSION: "0.9.3"
        CURRENT_PROJECT_VERSION: "12"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 맥북 앱(Mac Catalyst)
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PhotoLog/PhotoLog-mac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 82WN266F2F
        ENABLE_PREVIEWS: YES
