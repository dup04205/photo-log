# XcodeGen 설정. `xcodegen generate` 로 PhotoLog.xcodeproj 를 만든다(프로젝트 파일은 저장소에 두지 않는다).
name: PhotoLog
options:
  bundleIdPrefix: com.dup04205
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19

targets:
  PhotoLog:
    type: application
    platform: iOS
    sources:
      - path: PhotoLog
    dependencies:
      - package: ZIPFoundation
    scheme: {}
    info:
      path: PhotoLog/Info.plist
      properties:
        CFBundleDisplayName: PHOTO-LOG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - playfair_display_semibold_italic.ttf
          - playfair_display_bold_italic.ttf
          - gowun_batang_regular.ttf
          - gowun_batang_bold.ttf
          - dseg7_classic_italic.ttf
        NSCameraUsageDescription: 사진을 찍어 기록을 남기기 위해 카메라를 사용합니다.
        NSLocationWhenInUseUsageDescription: 카메라로 찍은 사진에 촬영 위치를 기록하기 위해 위치를 사용합니다.
        NSPhotoLibraryUsageDescription: 앨범에서 가져온 사진의 촬영 날짜와 위치를 읽기 위해 사진 보관함에 접근합니다.
    settings:
      base:
        PRODUCT_NAME: PhotoLog
        PRODUCT_BUNDLE_IDENTIFIER: com.dup04205.photolog
        MARKETING_VERSION: "0.9.3"
        CURRENT_PROJECT_VERSION: "12"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
